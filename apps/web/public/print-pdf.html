<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Print PDF</title>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
@media print {
  @page {
    size: landscape;
    margin: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: white !important;
  }

  body * {
    visibility: hidden;
  }

  #pdfFrame {
    visibility: visible;
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: white !important;
  }
} 
</style>

</head>

<body>
  <iframe id="pdfFrame"></iframe>

  <script>
  const params = new URLSearchParams(window.location.search);
  const pdfUrl = params.get("pdf");
  
  const iframe = document.getElementById("pdfFrame");
  
  if (pdfUrl) {
    iframe.src = pdfUrl + (pdfUrl.indexOf('#') >= 0 ? '&' : '#') + 'toolbar=0&navpanes=0';

    console.log("iframe.src", iframe);
  
    iframe.onload = () => {
      setTimeout(() => {
        window.print();
      }, 800);
    };
  }
  </script>

</body>
</html>
